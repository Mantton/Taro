[package]
name = "compiler"
version = "0.1.0"
edition = "2024"

[features]
nightly = []

[dependencies]
bitflags = "2.9.4"
ecow = { version = "0.2.6", features = ["serde"] }
index_vec = "0.1.4"
rustc-hash = "2.1.1"
colored = "3.0.0"
unicode-width = "0.2.1"
indexmap = "2.8.0"
typed-arena = "2.0.2"
ena = "0.14.3"
bumpalo = "3.17.0"
serde = { version = "1.0.219", features = ["derive"] }
bincode = "1.3.3"
blake3 = "1.8.2"
inkwell = { version = "0.9.0", default-features = false, features = ["llvm22-1"] }
# Keep llvm-sys direct so its selected llvm-config is available to build.rs.
llvm-sys = { version = "221.0.1", features = ["strict-versioning"] }
petgraph = "0.8.3"
toml = "0.8.20"
semver = { version = "1.0.26", features = ["serde"] }

[build-dependencies]
cc = "1.2"
