[package]
name = "taro-runtime"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Attributes allocations to call stacks for development/benchmarks/http/allocations.py.
alloc-profile = []

[dependencies]
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
libc = "0.2"
memmap2 = ">=0.9.11, <0.10"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

httparse = "=1.10.1"
http = "1.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
ring = "0.17"
subtle = "2.6"
zeroize = "1.9"

[dev-dependencies]
loom = "0.7"

[build-dependencies]
cc = "1"
