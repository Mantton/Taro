[[selection]]
root = "test/data"
include = ["*.json"]
default_classification = "yes"

[[selection.rule]]
classification = "implementation"
patterns = ["fail_test_stack_limit.json"]

# JsonCpp's legacy runner enables comments, leading zeroes, and trailing commas.
# These inputs are useful precisely because Taro's standard parser is strict.
[[selection.rule]]
classification = "no"
patterns = [
    "fail_*.json",
    "*comment*.json",
    "legacy_test_basic_01.json",
    "legacy_test_basic_02.json",
    "legacy_test_basic_08.json",
