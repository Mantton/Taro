[package]
name = "http-comparison"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net"] }

[profile.release]
debug = false
