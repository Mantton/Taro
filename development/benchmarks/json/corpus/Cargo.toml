[package]
name = "taro-json-corpus-reference"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "json-corpus-reference"
path = "main.rs"

[features]
allocation-audit = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
opt-level = 3
